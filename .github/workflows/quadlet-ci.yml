# .github/workflows/quadlet-ci.yml: vendored by Woow_quadlet_migration_plan/lib/sync-lib.sh.
# Static checks plus the pi-web builder stage; image-build checks cover OAuth and CLI binaries.
name: quadlet-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quadlet:
    runs-on: ubuntu-24.04          # apt podman = 4.9.3, systemd 255: same as the WOOWTECH hosts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test ChatGPT OAuth device-id patch
        run: |
          node --test patches/tests/chatgpt-device-id.test.mjs
          node --check patches/patch-chatgpt-device-id.mjs

      - name: Install podman and shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y podman shellcheck
          podman --version
          /usr/libexec/podman/quadlet -version
          shellcheck --version | sed -n 2p

      - name: Build pi-web stage and verify SDK OAuth behavior
        run: podman build --target piweb-builder --format=docker -f Containerfile .

      - name: Vendored quadlet-lib is unmodified
        run: sha256sum -c scripts/lib/quadlet-lib.manifest

      # The manifest above is written by the repo itself, so it only proves "not edited since
      # the copy". This step proves WHICH quadlet-lib this is, against the vendored ledger of
      # released (version, sha256) pairs. Two different files were once both called 1.7.0.
      - name: Vendored quadlet-lib really is the version it claims
        run: tests/lib-version.sh

      - name: Quadlet dry-run + systemd-analyze verify
        run: tests/dryrun.sh

      - name: The per-app lock is given back by a script that ends normally
        run: tests/lock-release.sh

      - name: shellcheck
        run: |
          shopt -s globstar nullglob
          shellcheck -x scripts/**/*.sh tests/*.sh
