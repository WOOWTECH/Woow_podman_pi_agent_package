# nginx:1.27-alpine's entrypoint already runs with `daemon off` — do not repeat it.
pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/stderr info;

events {
    worker_connections 512;
}

http {
    access_log /dev/stdout;
    # Keep every scratch path in /tmp so the container needs no writable /var.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    default_type application/octet-stream;
    include /etc/nginx/mime.types;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Chat responses stream over SSE. Buffering here truncates long generations
    # at the proxy and the UI simply stops mid-sentence.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_request_buffering off;

    client_max_body_size 100M;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 30142 default_server;

        location / {
            # Resolved once at startup through the container's own resolv.conf,
            # which netavark points at aardvark-dns. No `resolver` directive:
            # Podman's DNS does not live at Docker's 127.0.0.11, and hardcoding
            # any address here breaks the moment the network is recreated.
            #
            # The cost of start-time resolution is a stale IP if the pi-web
            # container is replaced. nginx.container is therefore PartOf
            # pi-web.service, so systemd restarts this container alongside it
            # and the address is always re-read.
            proxy_pass http://pi-web:30141;
            proxy_http_version 1.1;

            # The entire reason this container exists. pi-web's
            # isApiRequestAllowed() rejects any Host that is not a loopback
            # name or raw IP, and any Origin that does not match it. Traffic
            # arriving under a hostname fails both halves; every auth-gated
            # route (models, skills, plugins, sessions) then answers
            # 403 "Untrusted API request" while the UI still renders.
            proxy_set_header Host localhost;
            proxy_set_header Origin "";

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
